[versions]
agp              = "8.5.2"
kotlin           = "2.0.21"
ksp              = "2.0.21-1.0.28"
hilt             = "2.51.1"
hilt-androidx    = "1.2.0"
compose-bom      = "2024.12.01"
room             = "2.6.1"
workmanager      = "2.9.1"
datastore        = "1.1.1"
coroutines       = "1.9.0"
core-ktx         = "1.15.0"
lifecycle        = "2.8.7"
activity-compose = "1.9.3"
vico             = "1.15.0"
glance           = "1.1.0"
commons-csv      = "1.11.0"
browser          = "1.8.0"

[libraries]
compose-bom                = { group = "androidx.compose",           name = "compose-bom",             version.ref = "compose-bom" }
compose-ui                 = { group = "androidx.compose.ui",        name = "ui" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling         = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
core-ktx                   = { group = "androidx.core",              name = "core-ktx",                version.ref = "core-ktx" }
lifecycle-runtime          = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }
activity-compose           = { group = "androidx.activity",          name = "activity-compose",         version.ref = "activity-compose" }
room-runtime               = { group = "androidx.room",              name = "room-runtime",             version.ref = "room" }
room-ktx                   = { group = "androidx.room",              name = "room-ktx",                 version.ref = "room" }
room-compiler              = { group = "androidx.room",              name = "room-compiler",            version.ref = "room" }
hilt-android               = { group = "com.google.dagger",          name = "hilt-android",             version.ref = "hilt" }
hilt-compiler              = { group = "com.google.dagger",          name = "hilt-android-compiler",    version.ref = "hilt" }
hilt-work                  = { group = "androidx.hilt",              name = "hilt-work",                version.ref = "hilt-androidx" }
hilt-work-compiler         = { group = "androidx.hilt",              name = "hilt-compiler",            version.ref = "hilt-androidx" }
workmanager-ktx            = { group = "androidx.work",              name = "work-runtime-ktx",         version.ref = "workmanager" }
datastore-preferences      = { group = "androidx.datastore",         name = "datastore-preferences",    version.ref = "datastore" }
coroutines-android         = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android", version.ref = "coroutines" }
vico-compose               = { group = "com.patrykandpatrick.vico",  name = "compose",                  version.ref = "vico" }
vico-compose-m3            = { group = "com.patrykandpatrick.vico",  name = "compose-m3",               version.ref = "vico" }
glance-appwidget           = { group = "androidx.glance",            name = "glance-appwidget",         version.ref = "glance" }
glance-material3           = { group = "androidx.glance",            name = "glance-material3",         version.ref = "glance" }
commons-csv                = { group = "org.apache.commons",         name = "commons-csv",              version.ref = "commons-csv" }
browser                    = { group = "androidx.browser",           name = "browser",                  version.ref = "browser" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
